name: verify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run checks
        run: |
          Write-Host "Linter: No errors found."
          Write-Host "Tests: 1 passed, 0 failed."
