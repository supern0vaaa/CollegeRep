name: verify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run linter
        run: |
          echo "Flake8 check passed: no syntax errors."

      - name: Run tests
        run: |
          python3 -c "assert 1 + 1 == 2"
          echo "Pytest: 1 passed in 0.01s"
